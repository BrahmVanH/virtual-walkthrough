[package]
name = "pano-stitcher"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.99"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = [
    "console",
    "ImageData",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "Window",
] }
console_error_panic_hook = "0.1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"

# Computer vision (rust-cv ecosystem)
# crates.io akaze 0.7.0 depends on bitarray 0.2 (nightly-only) and image 0.23.
# rust-cv main uses image 0.25 + bitarray 0.9; "web-sys" enables its stage timing on wasm32.
akaze = { git = "https://github.com/rust-cv/cv", rev = "d271a9ac6a9d7b39c6f22573d26d63b5ce94f3cb", features = ["web-sys"] }
bitarray = "0.9"           # must match akaze's version so descriptor types line up
space = "0.17"             # kd-tree / nearest-neighbor for matching

# RANSAC
arrsac = "0.10"
sample-consensus = "1"

# Math
nalgebra = "0.33"
# arrsac 0.10 takes a rand_core 0.6 RngCore, so the PRNG must be on that version too.
rand_core = "0.6"
rand_pcg = "0.3"


# Logging
log = "0.4"
wasm-logger = "0.2"

# Version must match the locked wasm-bindgen (0.3.80 pins wasm-bindgen =0.2.130, js-sys =0.3.107).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
